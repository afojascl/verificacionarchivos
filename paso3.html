<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Documentos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #ffffff; color: #222222; min-height: 100vh; }

    .doc-header {
      text-align: center;
      padding: 18px 10px 14px 10px;
      font-size: 14px;
      font-weight: 700;
      color: #111111;
    }
    .doc-header span.doc-num {
      margin-left: 16px;
    }

    .table-wrapper {
      width: 100%;
      border-top: 2px solid #00825a;
      border-bottom: 2px solid #00825a;
      overflow-x: auto;
    }

    table.doc-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    table.doc-table thead th {
      background-color: #f3f4f4;
      color: #222222;
      font-size: 13px;
      font-weight: 400;
      text-align: left;
      padding: 12px 18px;
      border-bottom: 1px solid #e0e0e0;
    }

    table.doc-table thead th.col-fecha {
      text-align: center;
    }

    table.doc-table thead th.col-caratula {
      text-align: right;
    }

    table.doc-table tbody tr.main-row td {
      background-color: #ffffff;
      color: #222222;
      font-size: 13px;
      padding: 18px;
      border-bottom: 1px solid #e5e5e5;
    }

    table.doc-table tbody tr.main-row td.col-fecha {
      text-align: center;
    }

    table.doc-table tbody tr.main-row td.col-caratula {
      text-align: right;
    }

    .emisor-line1 {
      padding-left: 24px;
    }

    .emisor-line1 span.e-letra {
      margin-left: 12px;
    }

    .btn-descargar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(to bottom, #f7f7f7 0%, #dcdcdc 100%);
      border: 1.5px solid #222222;
      border-radius: 3px;
      padding: 4px 10px 4px 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #111111;
    }

    .btn-descargar:hover {
      background: linear-gradient(to bottom, #eeeeee, #cccccc);
    }

    .icon-dl-circle {
      width: 18px;
      height: 18px;
      background-color: #3a3a3a;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .datos-adicionales-row td {
      background-color: #fafafa;
      padding: 12px 18px;
      font-size: 13px;
      color: #444444;
    }

    .datos-adicionales-row span.listados-txt {
      margin-left: 12px;
    }
  </style>
</head>
<body>

  <!-- CABECERA DE LA TABLA -->
  <div class="doc-header">
    Verificación de Documentos <span class="doc-num" id="lblDocNum">Nº 123456905906</span>
  </div>

  <!-- TABLA PRINCIPAL -->
  <div class="table-wrapper">
    <table class="doc-table">
      <thead>
        <tr>
          <th style="width: 36%;">Certificado</th>
          <th class="col-fecha" style="width: 11%;">Fecha<br>Emisión</th>
          <th style="width: 13%;">Registro</th>
          <th class="col-caratula" style="width: 8%;">Carátula</th>
          <th style="width: 22%;">Emisor</th>
          <th style="width: 10%;"></th>
        </tr>
      </thead>
      <tbody>
        <tr class="main-row">
          <td id="lblCertificado">LISTADO DE BENEFICIARIOS</td>
          <td class="col-fecha" id="lblFecha">13-11-2026</td>
          <td id="lblRegistro">LISTADO PUBLICO</td>
          <td class="col-caratula" id="lblCaratula">0</td>
          <td class="emisor-cell">
            <div class="emisor-line1"><span id="lblEmisor1">Grupo Guias-Scouts</span> <span class="e-letra">e</span></div>
            <div id="lblEmisor2">EDUARDO LLANOS</div>
          </td>
          <td style="text-align: right;">
            <!-- BOTÓN PASO 4: DESCARGA DE PDF -->
            <button type="button" class="btn-descargar" onclick="descargarPDF()">
              <span class="icon-dl-circle">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none">
                  <path d="M4 2L8 6L4 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              Descargar
            </button>
          </td>
        </tr>
        <tr class="datos-adicionales-row">
          <td colspan="6">
            Datos Adicionales: - <span class="listados-txt">Listados</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // ================= CONFIGURACIÓN FÁCIL DE DATOS =================
    // Cambia estos valores aquí mismo cada vez que crees otro documento
    const datosDocumento = {
      numero: "123456905906",
      certificado: "LISTADO DE BENEFICIARIOS",
      fechaEmision: "13-11-2026",
      registro: "LISTADO PUBLICO",
      caratula: "0",
      emisorLinea1: "Grupo Guias-Scouts",
      emisorLinea2: "EDUARDO LLANOS",
      archivoPdf: "certificado.pdf" // Nombre de tu archivo PDF en GitHub
    };
    // ================================================================

    // Volcar los datos automáticamente en la tabla al cargar la página
    document.getElementById('lblDocNum').textContent = "Nº " + datosDocumento.numero;
    document.getElementById('lblCertificado').textContent = datosDocumento.certificado;
    document.getElementById('lblFecha').textContent = datosDocumento.fechaEmision;
    document.getElementById('lblRegistro').textContent = datosDocumento.registro;
    document.getElementById('lblCaratula').textContent = datosDocumento.caratula;
    document.getElementById('lblEmisor1').textContent = datosDocumento.emisorLinea1;
    document.getElementById('lblEmisor2').textContent = datosDocumento.emisorLinea2;

    // PASO 4: Función que abre el PDF en una pestaña nueva y lo descarga automáticamente
    function descargarPDF() {
      window.open(datosDocumento.archivoPdf, '_blank');
      const link = document.createElement('a');
      link.href = datosDocumento.archivoPdf;
      link.download = datosDocumento.certificado.replace(/ /g, '_') + '_' + datosDocumento.numero + '.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
