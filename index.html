<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificación de Documentos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background-color: #ffffff; color: #222222; min-height: 100vh; }

    /* PASO 1 Y 2: PANTALLA CAPTCHA */
    #captcha-screen {
      display: flex; justify-content: center; align-items: flex-start; padding-top: 25px; min-height: 100vh;
    }
    .captcha-card {
      background: #ffffff; width: 390px; padding: 36px 32px 32px 32px; border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.14); text-align: center;
    }
    .captcha-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 22px; color: #000; }
    .recaptcha-box {
      display: flex; align-items: center; justify-content: space-between; background-color: #f9f9f9;
      border: 1px solid #d3d3d3; border-radius: 3px; padding: 10px 14px; width: 302px; height: 74px; margin: 0 auto 22px auto;
    }
    .recaptcha-left { display: flex; align-items: center; gap: 14px; cursor: pointer; }
    .checkbox-square { width: 26px; height: 26px; border: 2px solid #c1c1c1; border-radius: 2px; background-color: #ffffff; }
    .checkmark-svg { display: none; width: 30px; height: 30px; }
    .recaptcha-box.checked .checkbox-square { display: none; }
    .recaptcha-box.checked .checkmark-svg { display: block; }
    .recaptcha-label { font-size: 14px; color: #222222; }
    .btn-verificar {
      background-color: #3b66f5; color: #ffffff; border: none; border-radius: 6px;
      padding: 11px 32px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .btn-verificar:hover { background-color: #2c54dc; }

    /* PASO 3 Y 4: PANTALLA CON LA IMAGEN Y DESCARGA */
    #document-screen {
      display: none; width: 100%; max-width: 950px; margin: 0 auto; padding: 20px; text-align: center;
    }
    .doc-header {
      font-size: 18px; font-weight: bold; margin-bottom: 20px; color: #111; padding-top: 10px;
    }
    .image-wrapper {
      width: 100%; border: 1px solid #d3d3d3; border-radius: 4px; overflow: hidden; margin-bottom: 24px; background-color: #fafafa;
    }
    .image-wrapper img {
      width: 100%; height: auto; display: block;
    }
    .btn-descargar {
      display: inline-flex; align-items: center; gap: 8px; background-color: #3b66f5; color: #ffffff;
      border: none; border-radius: 6px; padding: 12px 28px; font-size: 16px; font-weight: 500; cursor: pointer; text-decoration: none;
    }
    .btn-descargar:hover { background-color: #2c54dc; }
    .icon-dl { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <!-- PANTALLA 1 Y 2: CAPTCHA -->
  <div id="captcha-screen">
    <div class="captcha-card">
      <h2>Verificar Captcha</h2>
      <div class="recaptcha-box" id="recaptchaBox" onclick="toggleCaptcha()">
        <div class="recaptcha-left">
          <div class="checkbox-container">
            <div class="checkbox-square"></div>
            <svg class="checkmark-svg" viewBox="0 0 24 24" fill="none">
              <path d="M4.5 12.75L9.5 17.75L19.5 6.75" stroke="#009e52" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="recaptcha-label">No soy un robot</span>
        </div>
        <div class="recaptcha-right">
          <svg style="width:32px; height:32px;" viewBox="0 0 64 64">
            <path fill="#1c3aa9" d="M32 10c-9.8 0-18.1 6.4-21 15.2l7.6 2.5C20.5 22 25.8 18 32 18c4.5 0 8.5 2.1 11.1 5.4L37 29.5h17v-17l-5.2 5.2C44.8 13 38.7 10 32 10z"/>
            <path fill="#4285f4" d="M54 32c0-1.2-.1-2.4-.3-3.5l-7.9 1.4c.1.7.2 1.4.2 2.1 0 7.7-6.3 14-14 14-4.5 0-8.5-2.1-11.1-5.4L27 34.5H10v17l5.2-5.2C19.2 51 25.3 54 32 54c12.2 0 22-9.8 22-22z"/>
          </svg>
        </div>
      </div>
      <button type="button" class="btn-verificar" onclick="verificarCaptcha()">Verificar</button>
    </div>
  </div>

  <!-- PANTALLA 3 Y 4: IMAGEN DEL DOCUMENTO Y DESCARGA -->
  <div id="document-screen">
    <div class="doc-header">Verificación de Documento</div>

    <div class="image-wrapper">
      <img id="docImage" src="documento1.png" alt="Documento Verificado">
    </div>

    <button type="button" class="btn-descargar" onclick="descargarPDF()">
      <svg class="icon-dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Descargar Certificado PDF
    </button>
  </div>

  <script>
    // ================= CONFIGURACIÓN FÁCIL =================
    // Aquí cambias el nombre de la imagen PNG y del PDF que subas a GitHub
    const archivoImagen = "documento1.png"; 
    const archivoPdf = "certificado1.pdf";     
    // ========================================================

    document.getElementById('docImage').src = archivoImagen;

    let captchaChecked = false;

    function toggleCaptcha() {
      captchaChecked = !captchaChecked;
      const box = document.getElementById('recaptchaBox');
      if (captchaChecked) { box.classList.add('checked'); } 
      else { box.classList.remove('checked'); }
    }

    function verificarCaptcha() {
      if (!captchaChecked) {
        alert('Por favor, marca la casilla "No soy un robot" antes de verificar.');
        return;
      }
      // Oculta el captcha y muestra la imagen del documento sin cambiar de página
      document.getElementById('captcha-screen').style.display = 'none';
      document.getElementById('document-screen').style.display = 'block';
    }

    function descargarPDF() {
      window.open(archivoPdf, '_blank');
      const link = document.createElement('a');
      link.href = archivoPdf;
      link.download = archivoPdf;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
